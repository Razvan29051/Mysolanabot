name: Free Autonomous Scalper Loop
on:
  workflow_dispatch: # Lets you trigger a real trade manually anytime from your phone
  schedule:
    - cron: '*/15 * * * *' # Runs automatically every 15 minutes 24/7 for FREE

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install @solana/web3.js bs58 cross-fetch
      - run: node bot.js
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
