name: Free Autonomous Scalper Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node bot.cjs
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
