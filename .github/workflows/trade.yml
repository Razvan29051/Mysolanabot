name: Free Autonomous Scalper Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Run Trading Bot
        run: bun run bot.js
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
