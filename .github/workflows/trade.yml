name: Pump Graduation Rider

on:
  workflow_dispatch:          # Allows manual start
  schedule:
    - cron: '*/30 * * * *'    # Restart every 30 minutes (safer)

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # Stop before GitHub kills it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run Pump Listener Bot
        run: bun run pump_listener.js
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          WS_URL: ${{ secrets.WS_URL }}
